<!DOCTYPE html>

<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--navy:#0B2545;--navy2:#13315c;--gold:#B8912F;--gold2:#d9b45a;--goldt:#8a6a1c;--bg:#FAF8F3;--bg2:#EEF2F7;--card:#fff;--ink:#14213d;--mut:#5A6472;--line:#e4e0d4;--c1:#0B2545;--c2:#B8912F;--c3:#9fb0c8;--sh:0 18px 40px -18px rgba(11,37,69,.28);--serif:'Source Serif 4',Georgia,'Times New Roman',serif;--sans:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#071a33;--bg2:#0a2142;--card:#0f2a50;--ink:#f1ede2;--mut:#a9b4c5;--line:#1d3860;--goldt:#d9b45a;--c1:#6f95d1;--c3:#51688c;--sh:0 18px 40px -18px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#071a33;--bg2:#0a2142;--card:#0f2a50;--ink:#f1ede2;--mut:#a9b4c5;--line:#1d3860;--goldt:#d9b45a;--c1:#6f95d1;--c3:#51688c;--sh:0 18px 40px -18px rgba(0,0,0,.6)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.14;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(2.4rem,5.6vw,4.5rem)}h2{font-size:clamp(1.9rem,3.5vw,2.9rem)}h3{font-size:1.3rem}
p{margin:0 0 1em}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
section{padding:104px 0}
.alt{background:var(--bg2)}
.nv{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.nv::before{display:none}
.nv>.wrap{position:relative}
.eyebrow{display:inline-flex;align-items:center;gap:12px;font:500 12px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--goldt);margin-bottom:18px}
.nv .eyebrow,.hero .eyebrow,.ph .eyebrow{color:var(--gold2)}
.lead{font-size:1.15rem;color:var(--mut);max-width:620px}
.nv .lead,.hero .lead,.ph .lead{color:rgba(255,255,255,.78)}
.ctr{text-align:center}.ctr .lead{margin:16px auto 0}
.sh{margin-bottom:56px}.sh h2{max-width:760px}.ctr.sh h2{margin:0 auto}
em{font-style:normal;color:var(--gold2)}.hero h1 em{display:block}
.ic{width:28px;height:28px;display:block}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 28px;border-radius:4px;font:500 15px/1 var(--sans);border:1px solid transparent;cursor:pointer;transition:transform .35s,box-shadow .35s,background .35s,color .35s,border-color .35s}
.btn .ic{width:18px;height:18px;transition:transform .35s}.btn:hover .ic{transform:translateX(4px)}
.btn-gold{background:#c9a24a;color:#0B2545;font-weight:600}
.btn-gold:hover{background:#dcb85f}
.btn-line{border-color:rgba(255,255,255,.4);color:#fff}.btn-line:hover{background:rgba(255,255,255,.12);border-color:#fff}
.btn-navy{background:var(--navy);color:#fff}.btn-navy:hover{background:var(--navy2)}
:root[data-theme="dark"] .btn-navy,.btn-navy.on-dark{border-color:var(--gold)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:34px 30px;position:relative;overflow:hidden;transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s,border-color .45s}
.card:hover{box-shadow:var(--sh);border-color:var(--gold)}
.card .ic{color:var(--goldt);margin-bottom:22px;width:34px;height:34px}
.card p{color:var(--mut);margin:12px 0 0;font-size:.97rem}
.g{display:grid;gap:24px}.g3{grid-template-columns:repeat(auto-fit,minmax(290px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.rv{opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);transition-delay:var(--d,0s)}.rv.in{opacity:1;transform:none}
/* nav */
#nav{position:fixed;top:0;left:0;right:0;z-index:50;padding:calc(16px + env(safe-area-inset-top,0px)) 0 16px;color:#fff;transition:background .4s,padding .4s,box-shadow .4s}
#nav.solid{background:rgba(8,26,51,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;box-shadow:0 8px 30px -12px rgba(0,0,0,.5)}
#nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px}
.logo{display:flex;align-items:center;gap:12px;font:600 17px/1 var(--serif);letter-spacing:.14em}.logo small{display:block;font:400 9px/1 var(--sans);letter-spacing:.34em;color:var(--gold2);margin-top:6px}.logo svg{width:38px;height:38px}
.links{display:flex;align-items:center;gap:26px}.links a{font-size:14px;opacity:.85;position:relative;padding:6px 0;transition:opacity .3s}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold2);transform:scaleX(0);transform-origin:left;transition:transform .35s}
.links a:hover,.links a.on{opacity:1}.links a:hover::after,.links a.on::after{transform:scaleX(1)}
.links .btn{padding:12px 20px;font-size:14px;opacity:1}.links .btn::after{display:none}
.bg-b{display:none;background:none;border:0;color:#fff;cursor:pointer;padding:8px}.bg-b svg{width:28px;height:28px}
@media(max-width:1120px){.bg-b{display:block}.links{position:fixed;left:0;right:0;top:0;padding:calc(84px + env(safe-area-inset-top,0px)) 24px 28px;background:var(--navy);flex-direction:column;align-items:flex-start;gap:6px;transform:translateY(-110%);transition:transform .5s cubic-bezier(.2,.7,.2,1);z-index:-1;box-shadow:0 20px 40px rgba(0,0,0,.4)}.links.open{transform:none}.links a{font-size:17px;padding:10px 0;width:100%;border-bottom:1px solid rgba(255,255,255,.08)}.links .btn{margin-top:14px;width:auto;border:0}}
/* hero */
.hero{position:relative;min-height:100svh;display:flex;align-items:center;color:#fff;overflow:hidden;background:#050f20;padding:130px 0 150px}
.hero .bg{position:absolute;left:0;right:0;bottom:0;height:74%;will-change:transform;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 32%);mask-image:linear-gradient(to bottom,transparent 0,#000 32%)}.hero .bg svg{width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(5,16,34,.8) 0%,rgba(5,16,34,.4) 48%,transparent 80%),linear-gradient(0deg,rgba(5,16,34,.5),transparent 30%)}
.hc{position:relative;z-index:2;width:100%}.hero h1{max-width:820px;margin-bottom:26px}.hero .lead{margin-bottom:38px;font-size:1.2rem}
.cta{display:flex;flex-wrap:wrap;gap:16px}
.scue{position:absolute;z-index:2;left:50%;bottom:34px;transform:translateX(-50%);font:400 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:rgba(255,255,255,.6);display:flex;flex-direction:column;align-items:center;gap:12px}
.scue::after{content:"";width:1px;height:38px;background:linear-gradient(var(--gold2),transparent);animation:dr 2s infinite}
@keyframes dr{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
.stats{position:relative;z-index:3;margin-top:-72px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:var(--sh);display:grid;grid-template-columns:repeat(5,1fr);padding:34px 10px}
.stat{text-align:center;padding:6px 18px;border-right:1px solid var(--line)}.stat:last-child{border:0}
.stat b{display:block;font:600 clamp(2rem,3.6vw,3rem)/1.3 var(--serif);color:var(--goldt)}.stat span{display:block;font-size:.85rem;color:var(--mut);margin-top:8px;line-height:1.45}
@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr);gap:22px 0}.stat{border:0}.stat:last-child{grid-column:1/-1}}
/* page header */
.ph{background:var(--navy);color:#fff;padding:170px 0 90px;position:relative;overflow:hidden}
.ph::before{display:none}
.ph .wrap{position:relative}.ph h1{font-size:clamp(2.2rem,4.6vw,3.6rem);max-width:800px;margin-bottom:20px}.crumb{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:26px}.crumb a:hover{color:var(--gold2)}
/* split / steps */
.split{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:center}
@media(max-width:900px){.split{grid-template-columns:1fr;gap:36px}section{padding:76px 0}}
.num{font:600 .95rem/1 var(--sans);color:var(--goldt);letter-spacing:.2em}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:26px;position:relative}
.step{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:36px 30px;transition:background .45s,border-color .45s}
.step:hover{background:rgba(255,255,255,.09);border-color:var(--gold2)}
.step .big{font:600 2rem/1 var(--serif);color:var(--gold2);margin-bottom:22px}
.step h3{margin-bottom:12px}.step p{color:rgba(255,255,255,.75);font-size:.97rem}
ul.ck{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:10px}
ul.ck li{position:relative;padding-left:26px;font-size:.95rem;color:var(--mut)}.nv ul.ck li,.step ul.ck li{color:rgba(255,255,255,.82)}
ul.ck li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:6px;border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
.loop{margin-top:34px;text-align:center;font-size:.92rem;color:rgba(255,255,255,.7);letter-spacing:.04em}
/* tabs / donut */
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:28px 0}
.tab{padding:11px 20px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px/1 var(--sans);cursor:pointer;transition:all .3s}
.tab:hover{border-color:var(--gold)}.tab.on{background:var(--navy);color:#fff;border-color:var(--navy)}
:root[data-theme="dark"] .tab.on{border-color:var(--gold)}
.dn{display:flex;align-items:center;gap:34px;flex-wrap:wrap;justify-content:center}.dn svg{width:230px;height:230px;flex:none}
.dn circle{transition:stroke-dasharray 1s cubic-bezier(.2,.7,.2,1),stroke-dashoffset 1s cubic-bezier(.2,.7,.2,1)}
.lg{display:grid;gap:14px;min-width:200px}.lg div{display:flex;align-items:center;gap:12px;font-size:.95rem}.lg i{width:12px;height:12px;border-radius:3px;flex:none}.lg b{margin-left:auto;font:600 1.2rem var(--serif)}
.note{font-size:.82rem;color:var(--mut);font-style:italic;margin-top:18px}
/* quote */
.qt{padding:120px 0;text-align:center}.qt blockquote{margin:0 auto;max-width:860px;font:500 clamp(1.7rem,3.6vw,2.8rem)/1.3 var(--serif)}
/* team */
.av{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;font:600 1.6rem var(--serif);color:var(--gold2);background:radial-gradient(circle at 30% 25%,#1b4079,#0B2545);border:2px solid var(--gold);margin-bottom:22px}
.tm{text-align:center}.tm .role{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--goldt);margin:6px 0 0;font-weight:500}
.tm.card{padding:30px 22px}.tm .av{margin-left:auto;margin-right:auto}.tm.full p{font-size:.93rem}
.tg{display:inline-block;font:500 11px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--goldt);margin-bottom:14px}
.pc{cursor:pointer}.pc .rd{display:inline-flex;gap:8px;align-items:center;margin-top:18px;font-weight:500;font-size:.9rem;color:var(--goldt)}.pc .rd .ic{width:16px;height:16px;margin:0;transition:transform .3s}.pc:hover .rd .ic{transform:translateX(5px)}
.pcv{height:120px;margin:-34px -30px 24px;background:var(--navy);position:relative;overflow:hidden}.pcv svg{position:absolute;inset:0;width:100%;height:100%}
/* about */
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;margin-top:30px}.mini div{border-left:2px solid var(--gold);padding:2px 0 2px 16px}.mini b{display:block;font:600 1.5rem var(--serif);color:var(--goldt)}.mini span{font-size:.85rem;color:var(--mut)}
.nm{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}.nm .card{text-align:center}.nm .big{font:600 3rem var(--serif);color:var(--goldt);line-height:1}.nm small{display:block;letter-spacing:.2em;text-transform:uppercase;font-size:.74rem;color:var(--mut);margin:8px 0 12px}
.bars{display:grid;gap:20px;margin-top:10px}.br{display:grid;grid-template-columns:90px 1fr;gap:18px;align-items:center}.br b{font:600 1.1rem var(--serif)}
.tk{height:44px;background:var(--bg2);border-radius:8px;overflow:hidden}.alt .tk{background:var(--card)}.fl{height:100%;width:0;border-radius:8px;background:var(--gold);display:flex;align-items:center;justify-content:flex-end;padding-right:14px;color:#fff;font-weight:500;font-size:.9rem;white-space:nowrap;transition:width 1.4s cubic-bezier(.2,.7,.2,1)}
.fl.t{min-width:96px}
/* services */
.sr{display:grid;grid-template-columns:90px 1fr;gap:34px;padding:46px 0;border-bottom:1px solid var(--line)}.sr:first-child{padding-top:0}
.sr .ib{width:76px;height:76px;border-radius:50%;border:1px solid var(--gold);display:grid;place-items:center;color:var(--goldt);transition:all .4s}.sr:hover .ib{background:var(--navy);color:var(--gold2);transform:rotate(-6deg) scale(1.05)}
.sr .ib .ic{width:32px;height:32px}.sr h3{font-size:1.7rem;margin:6px 0 14px}.sr p{color:var(--mut);max-width:720px}
@media(max-width:640px){.sr{grid-template-columns:1fr;gap:20px}}
/* timeline */
.tl{position:relative;padding-left:34px;display:grid;gap:30px;max-width:640px}.tl::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:1px;background:linear-gradient(var(--gold),transparent)}
.tl div{position:relative}.tl div::before{content:"";position:absolute;left:-34px;top:6px;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--gold)}.tl b{display:block;font:600 1.15rem var(--serif);color:var(--goldt)}.tl span{color:var(--mut)}
.mt{font:600 1.05rem var(--serif);color:var(--goldt);background:var(--bg2);border-radius:10px;padding:10px 14px;display:inline-block;margin-top:16px;letter-spacing:.01em}
.alt .mt{background:var(--bg)}
.ef{width:100%;height:auto}.ef text{font:12px var(--sans);fill:var(--mut)}.ef .pa{stroke-dasharray:520;stroke-dashoffset:520;transition:stroke-dashoffset 2s ease}.in .ef .pa{stroke-dashoffset:0}
/* faq + form */
details{background:var(--card);border:1px solid var(--line);border-radius:6px;margin-bottom:14px;transition:border-color .3s,box-shadow .3s}details:hover,details[open]{border-color:var(--gold)}details[open]{box-shadow:var(--sh)}
summary{list-style:none;cursor:pointer;padding:22px 26px;font:600 1.12rem/1.4 var(--serif);display:flex;justify-content:space-between;gap:20px;align-items:center}summary::-webkit-details-marker{display:none}
summary::after{content:"+";font:300 1.8rem/1 var(--sans);color:var(--goldt);transition:transform .35s;flex:none}details[open] summary::after{transform:rotate(45deg)}
details p{padding:0 26px 24px;margin:0;color:var(--mut)}
.fm{display:grid;gap:18px}.fm label{display:grid;gap:8px;font-size:.88rem;font-weight:500}.fm .r{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:600px){.fm .r{grid-template-columns:1fr}}
.fm input,.fm select,.fm textarea{width:100%;font:400 15px var(--sans);padding:14px 16px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);transition:border-color .3s,box-shadow .3s}
.fm input:focus,.fm select:focus,.fm textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(184,145,47,.18)}.fm .bad{border-color:#c0392b}.fm small{color:#c0392b;min-height:0;font-weight:400}
.ok{text-align:center;padding:40px 10px}.ok .ic{width:56px;height:56px;margin:0 auto 20px;color:var(--goldt)}
.ci{display:flex;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}.ci .ic{width:24px;height:24px;color:var(--goldt);flex:none;margin-top:3px}.ci b{display:block;font-family:var(--serif);font-size:1.05rem}.ci span{color:var(--mut);font-size:.95rem}
/* cta + footer + modal */
.cb{padding:110px 0;text-align:center}.cb h2{max-width:760px;margin:0 auto 22px}.cb .lead{margin:0 auto 38px}
footer{background:#06152b;color:rgba(255,255,255,.72);padding:80px 0 calc(34px + env(safe-area-inset-bottom,0px));font-size:.93rem}
.fg{display:grid;grid-template-columns:1.5fr 1fr 1.2fr;gap:48px;margin-bottom:54px}@media(max-width:860px){.fg{grid-template-columns:1fr;gap:34px}}
footer h4{font:500 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-bottom:20px}footer .lk{display:grid;gap:10px}footer a:hover{color:var(--gold2)}
.fb{border-top:1px solid rgba(255,255,255,.12);padding-top:26px;font-size:.8rem;line-height:1.7;color:rgba(255,255,255,.5)}
.md{position:fixed;inset:0;z-index:80;background:rgba(5,14,30,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .35s}.md.open{opacity:1;pointer-events:auto}
.mb{background:var(--card);color:var(--ink);border-radius:18px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:46px 42px;position:relative;transform:translateY(20px);transition:transform .4s}.md.open .mb{transform:none}
.mb h3{font-size:1.8rem;margin-bottom:18px}.mb p{color:var(--mut)}.x{position:absolute;right:16px;top:12px;background:none;border:0;font-size:2rem;color:var(--mut);cursor:pointer;line-height:1}.x:hover{color:var(--goldt)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>

<body>
<header id="nav"><div class="wrap">
<a class="logo" href="#/" aria-label="Vixelia Capital - Trang chủ"><svg viewBox="0 0 40 40" fill="none"><rect x="1" y="1" width="38" height="38" rx="9" stroke="#B8912F" stroke-width="1.5"/><path d="M10 10l10 19 10-19" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 27l8-6 5 4 11-12" stroke="#d9b45a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>VIXELIA<small>CAPITAL</small></span></a>
<button class="bg-b" id="bg" aria-label="Mở menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
<nav class="links" id="lk"></nav>
</div></header>
<main id="app"></main>
<footer><div class="wrap" id="ft"></div></footer>

const WHY=[['target','Bắt đầu từ bạn, không bắt đầu từ thị trường','Mỗi danh mục của chúng tôi xuất phát từ mục tiêu, thời hạn và mức chấp nhận rủi ro của riêng bạn, được ghi lại trong một bản IPS cá nhân hóa.'],['flask','Khoa học, không cảm tính','Chúng tôi dựa trên những mô hình đã được kiểm chứng qua nhiều thập kỷ như Markowitz và CAPM, để mỗi quyết định có lý do và có số liệu.'],['eye','Minh bạch đến từng chi phí','Phương pháp, chỉ số đo lường và chi phí giao dịch đều được công khai trong báo cáo định kỳ. Bạn luôn biết tiền của mình đang ở đâu và vì sao.'],['hands','Đồng hành, không chỉ giao dịch','Cuộc sống thay đổi, danh mục của bạn cũng cần thay đổi theo. Chúng tôi rà soát cùng bạn mỗi sáu tháng và điều chỉnh khi cần.']];
const SV=[['doc','Tư vấn và lập IPS','Bản đồ chỉ đường cho mọi quyết định đầu tư của bạn','Trước khi nghĩ đến mua gì, hãy làm rõ bạn đang đi đâu. Chúng tôi phân tích hoàn cảnh, mục tiêu và ràng buộc của bạn, xếp mức chấp nhận rủi ro ở một trong ba nhóm thận trọng, cân bằng hoặc tăng trưởng, rồi cùng bạn viết nên bản IPS gồm chín thành phần theo chuẩn CFA. IPS là kim chỉ nam để mọi quyết định sau này đều có lý do rõ ràng.',['Phân tích hoàn cảnh tài chính, mục tiêu và ràng buộc','Đánh giá mức chấp nhận rủi ro: Conservative, Moderate, Aggressive','Xây dựng IPS 9 thành phần theo chuẩn CFA']],['pie','Quản lý danh mục đầu tư','Cổ phiếu, trái phiếu và tài sản an toàn được phối hợp để tối ưu lợi nhuận trên mỗi đơn vị rủi ro','Cổ phiếu được chọn theo cách tiếp cận từ trên xuống: vĩ mô, đến ngành, đến doanh nghiệp. Trái phiếu được định giá và quản trị bằng Duration, Convexity. Tài sản an toàn làm lớp đệm thanh khoản. Tất cả được phối hợp bằng mô hình Markowitz để tìm ra sự kết hợp mang lại lợi nhuận cao nhất trên mỗi đơn vị rủi ro.',['Cổ phiếu: phân tích cơ bản, Top-down, chọn mã theo ngành','Trái phiếu: định giá, Duration, Convexity, Immunization','Tài sản phi rủi ro: trái phiếu Chính phủ, tiền gửi, quỹ thị trường tiền tệ','Tối ưu hóa Markowitz Mean-Variance, tối đa hóa Sharpe Ratio']],['home','Hoạch định tài chính cá nhân','Biến mục tiêu mua nhà, nuôi con, nghỉ hưu thành kế hoạch rõ ràng','Mua nhà, mua xe, học phí cho con, một tuổi nghỉ hưu thoải mái. Chúng tôi biến từng ước mơ thành một con số, một mốc thời gian và một kế hoạch dòng tiền 5 đến 10 năm, đồng thời giúp bạn quản lý nợ và cấu trúc vốn cá nhân một cách thông minh.',['Mua nhà, mua xe, giáo dục con cái, hưu trí','Dự phóng dòng tiền 5 đến 10 năm','Quản lý nợ và cấu trúc vốn']],['shield','Quản trị rủi ro và đo lường hiệu quả','Hiểu rủi ro bạn đang nhận và chỉ nhận phần được đền đáp xứng đáng','Rủi ro không thể xóa bỏ, nhưng có thể hiểu và kiểm soát. Chúng tôi đo Beta, độ lệch chuẩn và hệ số biến thiên, xây dựng ma trận tương quan giữa các tài sản, và đánh giá kết quả bằng các chỉ số Sharpe, Treynor, Jensen Alpha và Information Ratio. Bạn nhận được báo cáo bằng ngôn ngữ dễ hiểu, không chỉ là những con số.',['Ma trận hiệp phương sai và ma trận tương quan','Beta, độ lệch chuẩn, hệ số biến thiên (CV)','Sharpe, Treynor, Jensen Alpha, Information Ratio']],['refresh','Tái cân bằng danh mục','Giữ danh mục đi đúng hướng một cách tiết kiệm chi phí','Thị trường luôn làm danh mục lệch khỏi kế hoạch. Khi một nhóm tài sản vượt hành lang ±5%, chúng tôi đưa danh mục về đúng hướng, ưu tiên dùng dòng tiền mới thay vì bán tài sản để tiết kiệm chi phí và thuế.',['Hành lang sai lệch ±5%','Ưu tiên dùng dòng tiền thặng dư thay vì bán tài sản','Tích hợp dòng tiền hàng tháng vào chiến lược tái cân bằng']]];

const PRN=[['layers','Đa dạng hóa','Đừng bỏ tất cả trứng vào một giỏ. Kết hợp các tài sản không đi cùng nhịp giúp giảm rủi ro mà không nhất thiết giảm lợi nhuận kỳ vọng.'],['chart','Rủi ro được trả công','Bạn chỉ nên nhận những rủi ro mà thị trường đền đáp. Chúng tôi đo bằng Beta và đánh giá bằng lợi nhuận điều chỉnh theo rủi ro.'],['eye','Tôn trọng thị trường','Thị trường phản ánh nhiều thông tin hơn mọi cá nhân. Chúng tôi giữ chi phí thấp và chỉ chủ động ở nơi còn dư địa.'],['pie','Phân bổ tài sản trước','Quyết định chia tiền giữa cổ phiếu, trái phiếu và tiền mặt quan trọng hơn việc chọn từng mã.'],['check','Kỷ luật hơn dự báo','Không ai dự báo thị trường chính xác mãi mãi. Một quy trình kỷ luật thì có thể.']];

const TM=[['NT','Nguyễn Ngọc Trâm','Tổng giám đốc','Với 18 năm trong ngân hàng đầu tư và quản lý tài sản, chị Trâm dẫn dắt định hướng chiến lược của Vixelia và giữ cho công ty luôn đi đúng tầm nhìn.'],['TT','Trần Ngọc Tuyết Trinh','Giám đốc đầu tư','Hơn 15 năm quản lý quỹ. Chị Trinh chịu trách nhiệm phân bổ tài sản chiến lược và chất lượng của mọi danh mục.'],['NM','Ngô Đặng Trà My','Trưởng bộ phận phân tích','Chị My kết hợp phân tích cơ bản và định lượng để tìm ra những cơ hội được định giá hợp lý.'],['TM','Trần Thị Phương Minh','Trưởng bộ phận quản trị rủi ro','Chị Minh là người đặt câu hỏi khó nhất: nếu điều xấu xảy ra, danh mục sẽ ra sao? Chị giám sát hạn mức và kiểm tra sức chịu đựng.'],['NA','Nguyễn Thị Trâm Anh','Trưởng bộ phận hoạch định tài chính','Chị Trâm Anh biến mục tiêu cuộc sống của khách hàng thành bản IPS và kế hoạch dòng tiền cụ thể.'],['ND','Ninh Thị Hồng Diễm','Giám đốc công nghệ','Chị Diễm xây dựng nền tảng để mọi con số đều minh bạch và mọi báo cáo đều chính xác.'],['MT','Nguyễn Minh Trang','Trưởng bộ phận vận hành và tuân thủ','Chị Trang bảo đảm mọi quy trình vận hành trơn tru, an toàn và tuân thủ pháp luật.']];
const PO=[['IPS','IPS là gì và vì sao mọi nhà đầu tư nghiêm túc đều cần một bản?','Trước khi chọn mua bất kỳ tài sản nào, hãy có một văn bản trả lời câu hỏi: tôi đang đầu tư để làm gì?'],['Đa dạng hóa','Đa dạng hóa: bữa trưa miễn phí duy nhất của tài chính','Vì sao việc kết hợp các tài sản khác nhau có thể giảm rủi ro mà không làm giảm lợi nhuận kỳ vọng.'],['Chỉ số','Sharpe Ratio: đừng chỉ nhìn lợi nhuận, hãy nhìn lợi nhuận trên mỗi đơn vị rủi ro','Hai danh mục cùng lãi 12% chưa chắc tốt như nhau. Đây là cách so sánh công bằng.'],['Trái phiếu','Lãi suất tăng, giá trái phiếu giảm: Duration giải thích điều đó thế nào','Một thước đo đơn giản giúp bạn biết trái phiếu của mình nhạy với lãi suất đến đâu.'],['Tái cân bằng','Tái cân bằng danh mục: khi nào nên, khi nào không?','Hành lang ±5% và lý do chúng tôi ưu tiên dùng dòng tiền mới thay vì bán tài sản.'],['Hoạch định','Mua nhà, nuôi con, nghỉ hưu: lập kế hoạch dòng tiền 10 năm','Ba mục tiêu lớn của một gia đình và cách xếp chúng vào cùng một kế hoạch.']];
const ART=['Hãy tưởng tượng bạn lái xe đi một chặng đường dài mà không có bản đồ. Có thể bạn vẫn đến nơi, nhưng chắc chắn bạn sẽ rẽ nhầm vài lần, tốn nhiều xăng hơn và lo lắng suốt chặng đường. Đầu tư mà không có Tuyên bố Chính sách Đầu tư (IPS) cũng như vậy.','IPS là một văn bản ngắn gọn ghi lại bạn muốn đạt được điều gì, trong bao lâu, bạn chịu được mức biến động nào và những giới hạn nào cần tôn trọng, chẳng hạn nhu cầu thanh khoản hay yếu tố thuế. Văn bản này gồm chín thành phần, từ bối cảnh và mục đích, đến mục tiêu, ràng buộc, hướng dẫn đầu tư và cách đánh giá kết quả.','Giá trị lớn nhất của IPS xuất hiện đúng lúc thị trường biến động. Khi mọi người hoảng loạn hay hưng phấn, IPS nhắc bạn rằng mọi quyết định đã được cân nhắc từ trước, trong lúc bình tĩnh. Đó là lý do tại Vixelia, mọi mối quan hệ đều bắt đầu từ một bản IPS.'];
const FQ=[['IPS là gì và tôi có cần một bản không?','IPS là văn bản ghi lại mục tiêu, thời hạn, mức chấp nhận rủi ro và ràng buộc của bạn. Mọi quyết định đầu tư sau này đều dựa trên đó. Chúng tôi lập IPS cho mỗi khách hàng trước khi bắt đầu đầu tư.'],['Vixelia có cam kết mức lợi nhuận không?','Không. Chúng tôi không cam kết lợi nhuận vì không ai làm được điều đó một cách trung thực. Điều chúng tôi cam kết là quy trình kỷ luật, minh bạch và mức rủi ro phù hợp với IPS của bạn.'],['Tôi cần bao nhiêu tiền để bắt đầu?','Mức tối thiểu được trao đổi trong buổi tư vấn đầu tiên và phụ thuộc vào loại dịch vụ. Dịch vụ lập IPS và hoạch định tài chính có thể phù hợp ngay cả khi bạn mới bắt đầu.'],['Chi phí dịch vụ được tính như thế nào?','Gồm phí lập IPS ban đầu và phí quản lý hàng năm tính trên giá trị tài sản ròng. Chi phí giao dịch được báo cáo công khai. Bạn có thể xem biểu phí chi tiết trong buổi tư vấn.'],['Bao lâu tôi nhận được báo cáo?','Báo cáo danh mục gửi hàng tháng, và chúng ta họp đánh giá hiệu quả cùng nhau mỗi sáu tháng.'],['Khi nào danh mục được tái cân bằng?','Khi tỷ trọng một nhóm tài sản lệch quá 5 điểm phần trăm so với mục tiêu. Chúng tôi ưu tiên dùng dòng tiền mới để điều chỉnh thay vì bán tài sản.'],['Tôi có thể rút tiền khi cần không?','Có thể. Nhu cầu thanh khoản của bạn được ghi trong IPS, và danh mục luôn giữ một phần tài sản thanh khoản tương ứng.'],['Thông tin của tôi có được bảo mật không?','Có. Chúng tôi áp dụng quy trình bảo mật chặt chẽ và chỉ dùng thông tin của bạn cho mục đích tư vấn và quản lý danh mục.']];
